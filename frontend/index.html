<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindSight — Wind Forecast Intelligence Platform</title>
    <meta name="description" content="Analytical decision-support platform for UK electricity purchasing decisions. Evaluates Elexon WINDFOR forecasts against actual FUELHH wind generation." />
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; background-color: #0F172A;">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0F172A; font-family: Inter, system-ui, -apple-system, sans-serif; color: white;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #0ea5e9, #0284c7); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(14,165,233,0.4); margin-bottom: 18px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
        </div>
        <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 6px;">WindSight</div>
        <div style="font-size: 13px; color: #94A3B8; margin-bottom: 28px; font-weight: 500;">Wind Forecast Intelligence Platform</div>
        <div style="width: 30px; height: 30px; border: 3px solid rgba(14,165,233,0.18); border-top-color: #0EA5E9; border-radius: 50%; animation: initial-spin 0.8s linear infinite;"></div>
        <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
